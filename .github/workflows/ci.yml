name: CI Test & Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Unit Tests (if package.json exists)
        run: |
          if [ -f "package.json" ]; then
            npm test
          else
            echo "No package.json found; skipping npm test."
          fi

      - name: Validate Math Level Generators (if script exists)
        run: |
          if [ -f "skills/validate-levels.cjs" ]; then
            node skills/validate-levels.cjs
          else
            echo "skills/validate-levels.cjs not found; skipping."
          fi

      - name: Check Module File Structure (if script exists)
        run: |
          if [ -f "skills/check-modules.cjs" ]; then
            node skills/check-modules.cjs
          else
            echo "skills/check-modules.cjs not found; skipping."
          fi
