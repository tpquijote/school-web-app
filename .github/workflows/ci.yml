name: CI Test & Validate

# Manual trigger only to prevent automatic CI runs on push/pull_request
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Run Unit Tests
        run: npm test

      - name: Validate Math Level Generators
        run: node skills/validate-levels.cjs

      - name: Check Module File Structure
        run: node skills/check-modules.cjs
