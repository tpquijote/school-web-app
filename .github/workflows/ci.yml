name: CI Test & Validate

on:
  push:
    branches: [ main, master, 'refactor-*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Unit Tests
        run: npm test

      - name: Validate Math Level Generators
        run: node skills/validate-levels.cjs

      - name: Check Module File Structure
        run: node skills/check-modules.cjs
