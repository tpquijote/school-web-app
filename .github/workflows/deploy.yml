name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (fetch all branches and history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Site Artifact (Live from main/origin/main, Preview from current branch)
        run: |
          mkdir -p _site
          mkdir -p _site/preview

          # Resolve robust git reference for Live site (origin/main, origin/master, main, or HEAD)
          MAIN_REF=$(git rev-parse --verify origin/main 2>/dev/null || git rev-parse --verify origin/master 2>/dev/null || git rev-parse --verify main 2>/dev/null || git rev-parse --verify master 2>/dev/null || echo "HEAD")
          echo "Using $MAIN_REF for Live site at root /"

          # Extract Live site from main reference into _site/ root
          git archive "$MAIN_REF" index.html style.css js | tar -x -C _site/

          # Extract Preview site from current HEAD branch into _site/preview/
          git archive HEAD index.html style.css js | tar -x -C _site/preview/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
